spring:
  application:
    name: pylos
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  http:
    client:
      connect-timeout: 5s
      read-timeout: 15s

server:
  port: 8080

pylos:
  api:
    token: ${PYLOS_API_TOKEN:}
    allowed-origins: ${PYLOS_ALLOWED_ORIGINS:chrome-extension://*}
  llm:
    api-key: ${GEMINI_API_KEY:}
    model-name: ${GEMINI_MODEL:gemini-3.5-flash}
    fallback-model-name: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
    max-attempts: 3
    retry-delay: 1s
    temperature: 0.2
    max-output-tokens: 2048
    timeout: 60s
    log-requests-and-responses: false

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}

logging:
  level:
    com.dreadvoice.pylos: INFO
