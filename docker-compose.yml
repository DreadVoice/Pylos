services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pylos
      POSTGRES_USER: ${POSTGRES_USERNAME:?set POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pylos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pylos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_URL: jdbc:postgresql://db:5432/pylos
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYLOS_API_TOKEN: ${PYLOS_API_TOKEN:?set PYLOS_API_TOKEN}
      PYLOS_ALLOWED_ORIGINS: ${PYLOS_ALLOWED_ORIGINS:-chrome-extension://*}
      PYLOS_ASSIST_RATE_LIMIT_ENABLED: ${PYLOS_ASSIST_RATE_LIMIT_ENABLED:-true}
      PYLOS_ASSIST_PER_CLIENT_LIMIT: ${PYLOS_ASSIST_PER_CLIENT_LIMIT:-5}
      PYLOS_ASSIST_PER_CLIENT_WINDOW: ${PYLOS_ASSIST_PER_CLIENT_WINDOW:-1m}
      PYLOS_ASSIST_GLOBAL_LIMIT: ${PYLOS_ASSIST_GLOBAL_LIMIT:-200}
      PYLOS_ASSIST_GLOBAL_WINDOW: ${PYLOS_ASSIST_GLOBAL_WINDOW:-1d}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:?set PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:?set PAYPAL_CLIENT_SECRET}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      SANDBOX_BUYER_EMAIL: ${SANDBOX_BUYER_EMAIL:-}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      PYLOS_DOMAIN: ${PYLOS_DOMAIN:?set PYLOS_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pylos-db:
  caddy-data:
  caddy-config:
